name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so a newly disclosed vulnerability in a dependency surfaces
    # even when nobody has pushed. Most advisories land against code that
    # was already written.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # govulncheck is call-graph aware: it only reports advisories whose
      # vulnerable symbols this code actually reaches, so its findings are
      # worth acting on rather than triaging away. The official action
      # manages its own toolchain, which the tool needs a newer one of than
      # this module targets.
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.24"
          work-dir: backend
          package: ./...

  staticcheck:
    name: Go static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: staticcheck
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

  gosec:
    name: Go security linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: gosec
        working-directory: backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -exclude-generated ./...
        env:
          # gosec needs a newer toolchain than the module targets; let the
          # go command fetch it rather than pinning the runner's Go forward.
          GOTOOLCHAIN: auto

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    # Only meaningful on a PR, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  container:
    name: Container image scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: build image
        run: docker build -t clipper:ci .
      # A scratch image has almost no surface for this to find, which is the
      # point — the scan is here to catch the day someone "just adds a shell
      # for debugging" and quietly reintroduces a distro's worth of CVEs.
      - name: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clipper:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: clipper:ci
          format: spdx-json
          artifact-name: clipper-sbom.spdx.json
