name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

# Go 1.24 is out of support: binaries built with it carry unfixable
# standard-library advisories. backend/go.mod pins the same toolchain.
env:
  GO_VERSION: "1.26"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: go vet
        working-directory: backend
        run: go vet ./...
      # -race is not optional here: the burn-after-read contract is a
      # concurrency guarantee ("two readers can never both succeed"), and a
      # data race in the store or limiter is exactly the kind of bug that
      # only shows up under load in production.
      - name: go test (race)
        working-directory: backend
        run: go test -race ./...
      - name: go build (integration tags)
        working-directory: backend
        run: go vet -tags=integration ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: test
        working-directory: frontend
        run: npm test -- --run
      - name: build
        working-directory: frontend
        run: npm run build

  build-binary:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: build
        run: make build
      # The scratch runtime image only works because this binary has no
      # dynamic dependencies. Asserting it here means a stray cgo import
      # fails CI instead of producing an image that cannot start.
      - name: assert the binary is static
        run: |
          file backend/clipper
          file backend/clipper | grep -q "statically linked"
          ! ldd backend/clipper 2>/dev/null
